name: Calendar and customer analysis regression

on:
  push:
    paths:
      - 'salon-appointment-data.js'
      - 'salon-modern.html'
      - 'salon-finance-2.3.0.js'
      - 'salon-performance-2.3.14.js'
      - 'salon-ui-fixes-2.3.16.js'
      - 'smart-customer-analysis-1.7.0.js'
      - 'sw.js'
      - 'supabase/functions/bootstrap-salon/index.ts'
      - 'tests/client-load-race.test.js'
      - 'tests/calendar-price-index.test.js'
      - 'tests/pwa-asset-consistency.test.js'
      - 'tests/bootstrap-auth.test.js'
      - 'supabase/migrations/**'
      - 'tests/appointment-pagination.test.js'
      - 'tests/appointment-list-management.test.js'
      - 'tests/finance-close-day.test.js'
      - 'tests/finance-date-records.test.js'
      - 'tests/calendar-preview-race.test.js'
      - 'tests/calendar-startup-priority.test.js'
      - 'tests/calendar-date-boundary.test.js'
      - 'tests/finance-startup-priority.test.js'
      - 'tests/smart-client-visit-summary.test.js'
      - '.github/workflows/calendar-analysis-regression.yml'
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/appointment-pagination.test.js
      - run: node tests/appointment-list-management.test.js
      - run: node tests/finance-close-day.test.js
      - run: node tests/finance-date-records.test.js
      - run: node tests/calendar-preview-race.test.js
      - run: node tests/calendar-startup-priority.test.js
      - run: node tests/calendar-date-boundary.test.js
      - run: node tests/finance-startup-priority.test.js
      - run: node tests/smart-client-visit-summary.test.js
      - run: node tests/client-load-race.test.js
      - run: node tests/calendar-price-index.test.js
      - run: node tests/pwa-asset-consistency.test.js
      - run: node tests/bootstrap-auth.test.js
