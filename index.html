<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Salon Modern | Giriş</title>
  <meta name="description" content="Salon Modern personel yönetimi ve online randevu girişleri.">
  <meta name="theme-color" content="#102622">
  <link rel="icon" href="salon-icon-192.png">
  <style>
    :root{color-scheme:dark;--ink:#fbf7ee;--muted:#b8c4bf;--dark:#0d1b18;--panel:#172824;--line:#385048;--gold:#c99a54;--gold-light:#ecd097}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -12%,#38534a 0,#12241f 42%,#091310 100%);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{min-height:100vh;width:min(100%,560px);margin:auto;padding:calc(34px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
    .brand{text-align:center;margin-bottom:30px}.brand img{width:104px;height:104px;object-fit:cover;border-radius:50%;border:1px solid var(--gold);background:#fff}.eyebrow{color:var(--gold-light);font-size:12px;font-weight:800;letter-spacing:.22em;margin:18px 0 5px}.brand h1{font:700 42px/1.05 Georgia,serif;margin:0}.brand p{color:var(--muted);margin:14px auto 0;max-width:410px}
    .choices{display:grid;gap:14px}.choice{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);padding:20px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1c302a,#13231f);box-shadow:0 18px 45px #0005}.choice.primary{border-color:#9b763f;background:linear-gradient(145deg,#c99a54,#a87939);color:#17110a}.icon{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:#ffffff14;font-size:25px;flex:none}.choice.primary .icon{background:#fff3}.copy{flex:1}.copy strong{display:block;font-size:19px}.copy small{display:block;color:var(--muted);margin-top:3px}.choice.primary small{color:#33230f}.arrow{font-size:25px}
    footer{text-align:center;margin-top:25px}footer a{color:var(--gold-light);text-underline-offset:4px}
    @media(min-width:760px){main{padding-top:48px}.choices{grid-template-columns:1fr 1fr}.choice{min-height:150px;align-items:flex-start;flex-wrap:wrap}.copy{min-width:140px}.arrow{margin-left:auto}}
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <img src="salon_brand_logo.jpg" alt="Salon Modern">
      <p class="eyebrow">SALON MODERN</p>
      <h1>Nasıl devam etmek istersiniz?</h1>
      <p>Müşteri randevusu ile personel yönetimi birbirinden ayrı ve güvenli alanlarda çalışır.</p>
    </header>
    <section class="choices" aria-label="Giriş seçimi">
      <a class="choice primary" href="randevu/">
        <span class="icon" aria-hidden="true">◷</span>
        <span class="copy"><strong>Randevu Al</strong><small>Hizmet, çalışan, tarih ve uygun saati seçin.</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="choice" href="salon-modern.html">
        <span class="icon" aria-hidden="true">♙</span>
        <span class="copy"><strong>Personel Girişi</strong><small>Salon yönetim ekranına güvenli giriş yapın.</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>
    <footer><a href="https://salonmodern.com.tr/">Salon Modern web sitesine dön</a></footer>
  </main>
</body>
</html>
