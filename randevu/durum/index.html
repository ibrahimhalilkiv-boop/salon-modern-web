<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randevum | Salon Modern</title><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="../booking.css"><meta name="theme-color" content="#101917"></head>
<body><main class="booking-shell"><header class="hero"><p class="eyebrow">SALON MODERN</p><h1>Randevum</h1></header><section class="card"><label>Güvenli takip kodu<input id="token" autocomplete="off" placeholder="Randevunuzdaki takip kodu"></label><button class="button-link" id="check" type="button">Randevuyu göster</button><div id="result" class="summary" aria-live="polite" hidden></div>
<form id="manage" hidden><p>Hizmet ve çalışan değişmeden tarih ve saati güncelleyebilirsiniz.</p><label>Tarih<input id="date" type="date" required></label><label>Saat<select id="time" required><option value="">Önce tarih seçin</option></select></label><button id="update" class="button-link" type="submit" disabled>Tarih ve saati güncelle</button><button id="cancel" class="button-link" type="button">Randevuyu iptal et</button></form>
<dialog id="cancelDialog"><p>Randevunuzu iptal etmek istediğinize emin misiniz?</p><button id="confirmCancel" type="button">İptal Et</button><button id="keep" type="button">Vazgeç</button></dialog><p id="message" role="status"></p></section><footer><a href="../">Yeni randevu oluştur</a></footer></main><script src="manage.js?v=94"></script></body></html>
