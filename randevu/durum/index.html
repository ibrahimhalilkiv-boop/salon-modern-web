<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randevu Talebi Durumu | Salon Modern</title><meta name="robots" content="noindex"><link rel="stylesheet" href="../booking.css"><meta name="theme-color" content="#101917"></head><body><main class="booking-shell"><header class="hero"><p class="eyebrow">SALON MODERN</p><h1>Talep Durumu</h1></header><section class="card"><label>Güvenli takip kodu<input id="token" autocomplete="off" placeholder="Talebinizdeki takip kodu"></label><button class="button-link" id="check" type="button">Durumu kontrol et</button><div id="result" class="summary" hidden></div></section><footer><a href="../">Yeni randevu talebi oluştur</a></footer></main><script>(function(){var API='https://oxuwwjsakhcqimjsfris.supabase.co/functions/v1/customer-booking-request',q=function(id){return document.getElementById(id)},labels={pending:'Talebiniz inceleniyor',approved:'Randevunuz onaylandı',rejected:'Talebiniz onaylanamadı',cancelled:'Talebiniz iptal edildi'};async function check(){var token=q('token').value.trim(),box=q('result');box.hidden=false;box.textContent='Kontrol ediliyor…';try{var response=await fetch(API+'?action=status&token='+encodeURIComponent(token),{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Talep bulunamadı.');box.innerHTML='<h2>'+labels[data.status]+'</h2><p>'+data.requested_date+'</p>'}catch(error){box.textContent=error.message}}q('check').onclick=check;var token=new URLSearchParams(location.search).get('token');if(token){q('token').value=token;check()}})();</script></body></html>
